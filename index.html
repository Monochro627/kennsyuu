<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新人営業研修</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1 id="app-title">新人営業研修</h1>
    <p id="app-subtitle" class="subtitle"></p>
  </header>

  <nav class="tabs" role="tablist">
    <a href="#flow" class="tab" data-tab="flow">🎓 卒業フロー</a>
    <a href="#materials" class="tab" data-tab="materials">📚 資料・動画</a>
    <a href="#chat" class="tab" data-tab="chat">💬 AIチャット</a>
  </nav>

  <main>
    <!-- ① 卒業までのフロー -->
    <section id="view-flow" class="view">
      <div class="progress-card">
        <div class="progress-head">
          <span>卒業までの進捗</span>
          <strong id="progress-label">0%</strong>
        </div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <p id="progress-next" class="muted"></p>
      </div>
      <ol id="step-list" class="steps"></ol>
      <button id="reset-progress" class="link-button">進捗をリセット</button>
    </section>

    <!-- ② 資料・研修動画 -->
    <section id="view-materials" class="view" hidden>
      <div class="filter-row">
        <input id="material-search" type="search" placeholder="資料を検索…">
        <select id="material-step"></select>
      </div>
      <div id="material-list" class="materials"></div>
    </section>

    <!-- ③ NotebookLM チャット -->
    <section id="view-chat" class="view" hidden>
      <div class="chat-card">
        <h2>新人用AIチャット（NotebookLM）</h2>
        <p>研修資料を学習したAIに、わからないことをいつでも質問できます。</p>
        <a id="notebook-link" class="primary-button" target="_blank" rel="noopener">NotebookLMを開く ↗</a>
        <p class="muted small">※ NotebookLMはGoogleの仕様上アプリ内に埋め込めないため、別タブで開きます。会社のGoogleアカウントでログインしてください。</p>
      </div>
      <h3>質問の例</h3>
      <ul id="chat-examples" class="examples"></ul>
    </section>
  </main>

  <dialog id="viewer">
    <div class="viewer-head">
      <strong id="viewer-title"></strong>
      <div>
        <a id="viewer-open" target="_blank" rel="noopener">別タブ ↗</a>
        <button id="viewer-close" aria-label="閉じる">✕</button>
      </div>
    </div>
    <div id="viewer-body" class="viewer-body"></div>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
