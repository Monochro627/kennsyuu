<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d0d0d; --ink2: #2b2b2b; --paper: #f6f5f1; --card: #ffffff; --line: #e4e2dc; --mute: #77756f;
    --g1: #2a2a2a; --g2: #454545; --g3: #6b6b6b; --g4: #8f8f8f; --g5: #b8b8b8; --g6: #dcdcdc;
    --en: "Montserrat", "Zen Kaku Gothic New", sans-serif;
    --jp: "Zen Kaku Gothic New", -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.7 var(--jp); padding-bottom: 84px; }
  body.reading { overflow: hidden; }
  a { color: inherit; }
  .en { font-family: var(--en); letter-spacing: .08em; }
  .dots { background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1.2px); background-size: 9px 9px; }

  /* ヘッダーとタブ */
  header.top { background: var(--ink); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  .logo { display: flex; align-items: center; gap: 9px; }
  .logo b { font: 800 1rem/1 var(--en); letter-spacing: .22em; }
  .logo small { display: block; font: 500 .58rem/1.4 var(--en); letter-spacing: .32em; opacity: .6; }
  .chip { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: .78rem; border: 1px solid rgba(255,255,255,.25); border-radius: 99px; padding: 4px 12px 4px 5px; }
  .chip .dot { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); }
  .chip .pt { font: 700 .78rem var(--en); }
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs button { flex: 1; border: 0; background: none; padding: 9px 2px 10px; font: 500 .66rem var(--jp); color: var(--mute); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav.tabs svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  nav.tabs button.active { color: var(--ink); font-weight: 700; }
  nav.tabs button.active svg { stroke-width: 2.2; }
  @media (min-width: 820px) {
    body { padding-bottom: 0; }
    nav.tabs { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); justify-content: center; }
    nav.tabs button { flex: 0 0 auto; flex-direction: row; font-size: .85rem; padding: 13px 18px; gap: 7px; border-bottom: 2px solid transparent; }
    nav.tabs button.active { border-bottom-color: var(--ink); }
    nav.tabs svg { width: 18px; height: 18px; }
  }
  main { max-width: 920px; margin: 0 auto; padding: 18px 16px 28px; }

  /* 共通パーツ */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
  .card.ink { background: var(--ink); color: #fff; border-color: var(--ink); }
  .eyebrow { font: 700 .66rem/1 var(--en); letter-spacing: .28em; color: var(--mute); text-transform: uppercase; }
  .ink .eyebrow { color: rgba(255,255,255,.55); }
  h2.title { font-size: 1.15rem; margin: 6px 0 14px; letter-spacing: .02em; }
  .section-head { display: flex; align-items: flex-end; gap: 10px; margin: 28px 2px 12px; }
  .section-head h2 { margin: 0; font-size: 1.05rem; }
  .section-head .en { font-size: .64rem; color: var(--mute); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .muted { color: var(--mute); }
  .small { font-size: .8rem; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font: 700 .66rem/1 var(--en); letter-spacing: .08em; padding: 5px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
  .pill.solid { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pill.jp { font-family: var(--jp); letter-spacing: 0; font-weight: 700; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--ink); border-radius: 99px; padding: 9px 18px; font: 700 .85rem var(--jp); background: var(--ink); color: #fff; cursor: pointer; text-decoration: none; transition: transform .15s; }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: transparent; color: var(--ink); }
  .ink .btn { background: #fff; color: var(--ink); border-color: #fff; }
  .ink .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
  .btn:disabled { opacity: .45; cursor: wait; }
  .bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .ink .bar { background: rgba(255,255,255,.18); }
  .ink .bar > i { background: #fff; }
  select, input, textarea { font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); width: 100%; outline: none; }
  select:focus, input:focus, textarea:focus { border-color: var(--ink); }
  textarea { min-height: 90px; resize: vertical; }
  label.field { display: block; margin-bottom: 12px; font-size: .78rem; font-weight: 700; }
  label.field > * { margin-top: 5px; font-weight: 400; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .empty { text-align: center; color: var(--mute); padding: 28px 0 8px; }
  .empty svg { width: 120px; display: block; margin: 0 auto 8px; }
  .loading { text-align: center; color: var(--mute); padding: 70px 0; font: 700 .7rem var(--en); letter-spacing: .3em; }
  .loading::before { content: ""; display: block; width: 26px; height: 26px; margin: 0 auto 14px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } .hide-sm { display: none !important; } }

  /* ヒーロー（黒から白へ） */
  .hero { position: relative; overflow: hidden; padding: 22px 20px 18px; }
  .hero .copy { font: 800 1.55rem/1.2 var(--jp); letter-spacing: .04em; margin: 8px 0 2px; }
  .hero .stage-name { font: 800 .8rem var(--en); letter-spacing: .3em; }
  .hero .pct { font: 800 3.4rem/1 var(--en); letter-spacing: -.02em; }
  .hero .pct small { font-size: 1.1rem; margin-left: 2px; }
  .hero svg.stairs { width: 100%; max-width: 420px; height: auto; display: block; margin: 8px 0 6px auto; }
  .hero-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 12px; align-items: end; }
  @media (max-width: 560px) { .hero-grid { grid-template-columns: 1fr; } }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid rgba(255,255,255,.15); margin-top: 12px; padding-top: 12px; }
  .stats div { text-align: center; }
  .stats b { display: block; font: 800 1.35rem/1.1 var(--en); }
  .stats span { font: 700 .58rem var(--en); letter-spacing: .22em; opacity: .55; }
  .viewer-select { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .viewer-select select { flex: 1; }

  /* 次のアクション */
  .next { display: grid; gap: 10px; }
  .next-item { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; }
  .next-item .ico { width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; flex: none; }
  .next-item .ico svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 1.8; }
  .next-item .t { flex: 1; min-width: 0; }
  .next-item .t div:first-child { font-weight: 700; }

  /* バッジ */
  .badges { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
  .badge { flex: none; width: 78px; text-align: center; font-size: .66rem; color: var(--mute); }
  .badge svg { width: 62px; height: 70px; display: block; margin: 0 auto 4px; }
  .badge.on { color: var(--ink); font-weight: 700; }
  .badge.new svg { animation: pop .7s ease; }
  @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }

  /* チェックリスト */
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; position: relative; }
  .check:first-child { border-top: 0; }
  .check input { position: absolute; opacity: 0; pointer-events: none; }
  .box { width: 24px; height: 24px; border: 1.6px solid var(--ink); border-radius: 7px; flex: none; margin-top: 1px; display: grid; place-items: center; transition: background .2s; }
  .box svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; transform: scale(.4); transition: all .25s cubic-bezier(.2,1.6,.4,1); }
  .check input:checked + .box { background: var(--ink); }
  .check input:checked + .box svg { opacity: 1; transform: none; }
  .check input:disabled + .box { border-color: var(--g5); }
  .check input:disabled:checked + .box { background: var(--g4); border-color: var(--g4); }
  .check .num { font: 800 .7rem var(--en); color: var(--g5); width: 20px; margin-top: 4px; flex: none; }
  .check .t { flex: 1; min-width: 0; }
  .check .t .main { font-weight: 500; }
  .check.done .t .main { color: var(--mute); text-decoration: line-through; text-decoration-thickness: 1px; }
  .check .meta { font-size: .72rem; color: var(--mute); }
  .float-pt { position: fixed; z-index: 40; font: 800 1rem var(--en); color: var(--ink); pointer-events: none; animation: floatup 1.1s ease-out forwards; }
  @keyframes floatup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-46px); } }

  /* フェーズのタイムライン */
  .timeline { position: relative; padding-left: 30px; }
  .timeline::before { content: ""; position: absolute; left: 11px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
  .phase { position: relative; margin-bottom: 12px; }
  .phase .node { position: absolute; left: -30px; top: 15px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--g5); background: var(--paper); display: grid; place-items: center; font: 800 .62rem var(--en); color: var(--g4); }
  .phase.done .node { background: var(--ink); border-color: var(--ink); color: #fff; }
  .phase.current .node { border-color: var(--ink); color: var(--ink); box-shadow: 0 0 0 5px rgba(13,13,13,.1); }
  .phase details { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .phase.current details { border-color: var(--ink); box-shadow: 0 6px 24px rgba(0,0,0,.07); }
  .phase summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; gap: 10px; align-items: center; }
  .phase summary::-webkit-details-marker { display: none; }
  .phase summary strong { flex: 1; }
  .phase .body { padding: 0 16px 8px; }
  .phase .mini { width: 54px; }

  /* みんな */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 3px; background: #fff; }
  .seg button { border: 0; background: none; border-radius: 99px; padding: 6px 12px; font: 700 .75rem var(--jp); color: var(--mute); cursor: pointer; }
  .seg button.on { background: var(--ink); color: #fff; }
  .leader { display: grid; grid-template-columns: 34px 46px 1fr auto; gap: 12px; align-items: center; padding: 14px 4px; border-top: 1px solid var(--line); cursor: pointer; }
  .leader:first-child { border-top: 0; }
  .leader .rank { font: 800 1.1rem var(--en); color: var(--g5); text-align: center; }
  .leader.top .rank { color: var(--ink); }
  .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font: 700 .95rem var(--jp); border: 1.5px solid var(--ink); }
  .leader .score { text-align: right; }
  .leader .score b { font: 800 1.05rem var(--en); display: block; }
  .leader .score span { font-size: .68rem; color: var(--mute); }
  .mvp { display: flex; gap: 14px; align-items: center; }
  .mvp .crown { font: 800 2.4rem/1 var(--en); }

  /* eラーニング */
  .sec-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 12px; overflow: hidden; }
  .sec-card > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
  .sec-card > summary::-webkit-details-marker { display: none; }
  .sec-no { width: 46px; height: 46px; border-radius: 12px; background: var(--ink); color: #fff; display: grid; place-items: center; font: 800 1.1rem var(--en); flex: none; }
  .sec-card.opt .sec-no { background: #fff; color: var(--ink); border: 1.5px solid var(--ink); }
  .sec-card.complete .sec-no { background: repeating-linear-gradient(45deg, var(--ink) 0 4px, var(--g2) 4px 8px); }
  .ring { width: 40px; height: 40px; flex: none; }
  .vid { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 16px; font: inherit; color: inherit; cursor: pointer; }
  .vid:hover { background: #faf9f6; }
  .thumb { width: 104px; aspect-ratio: 16/9; border-radius: 9px; background: var(--g6) center/cover; flex: none; position: relative; filter: grayscale(1) contrast(1.05); transition: filter .3s; overflow: hidden; }
  .vid:hover .thumb { filter: none; }
  .thumb .done { position: absolute; inset: 0; background: rgba(13,13,13,.62); color: #fff; display: grid; place-items: center; font: 800 .62rem var(--en); letter-spacing: .2em; }
  .vid .t { flex: 1; min-width: 0; }
  .vid .t div:first-child { font-weight: 500; line-height: 1.5; }

  /* マニュアル一覧 */
  .man-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .man { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 10px; min-height: 132px; transition: transform .2s, box-shadow .2s; }
  .man:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,.08); }
  .man svg { width: 34px; height: 34px; stroke: var(--ink); fill: none; stroke-width: 1.4; }
  .man b { font-size: .92rem; line-height: 1.5; }
  .man .k { margin-top: auto; }

  /* マニュアルリーダー */
  .reader { position: fixed; inset: 0; z-index: 25; background: var(--paper); overflow-y: auto; }
  .reader .bar-top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: rgba(13,13,13,.96); color: #fff; }
  .reader .bar-top strong { flex: 1; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reader .bar-top button, .reader .bar-top a { border: 1px solid rgba(255,255,255,.35); background: none; color: #fff; border-radius: 99px; padding: 6px 12px; font: 700 .75rem var(--jp); cursor: pointer; text-decoration: none; white-space: nowrap; }
  .reader .cover { background: var(--ink); color: #fff; padding: 34px 20px 30px; }
  .reader .cover h1 { font-size: 1.7rem; line-height: 1.35; margin: 10px 0 12px; max-width: 760px; }
  .reader .cover .wrap, .reader .layout { max-width: 1040px; margin: 0 auto; }
  .reader .layout { display: grid; grid-template-columns: 230px 1fr; gap: 32px; padding: 26px 20px 80px; }
  @media (max-width: 860px) { .reader .layout { grid-template-columns: 1fr; gap: 10px; } }
  .toc { position: sticky; top: 64px; align-self: start; font-size: .82rem; }
  .toc a { display: block; text-decoration: none; padding: 6px 0 6px 12px; border-left: 2px solid var(--line); color: var(--mute); line-height: 1.5; }
  .toc a.l3 { padding-left: 24px; font-size: .76rem; }
  .toc a.on, .toc a:hover { border-left-color: var(--ink); color: var(--ink); font-weight: 700; }
  @media (max-width: 860px) {
    .toc { position: static; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
    .toc a { flex: none; border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; background: #fff; }
    .toc a.l3 { display: none; }
  }
  .doc { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 28px clamp(18px, 4vw, 44px); font-size: 1rem; line-height: 1.95; min-width: 0; }
  .doc h2 { font-size: 1.25rem; margin: 2.2em 0 .8em; padding: 0 0 .5em; border-bottom: 2px solid var(--ink); counter-increment: sec; display: flex; gap: 12px; align-items: baseline; scroll-margin-top: 70px; }
  .doc { counter-reset: sec; }
  .doc h2::before { content: counter(sec, decimal-leading-zero); font: 800 .85rem var(--en); background: var(--ink); color: #fff; padding: 3px 8px; border-radius: 6px; }
  .doc h2:first-child { margin-top: 0; }
  .doc h3 { font-size: 1.05rem; margin: 1.8em 0 .6em; padding-left: 12px; border-left: 4px solid var(--ink); scroll-margin-top: 70px; }
  .doc h4 { font-size: .98rem; margin: 1.4em 0 .4em; }
  .doc p { margin: .55em 0; }
  .doc ul, .doc ol { padding-left: 1.3em; }
  .doc li { margin: .3em 0; }
  .doc li::marker { color: var(--g4); }
  .doc b { background: linear-gradient(transparent 62%, #e6e3da 62%); }
  .doc figure { margin: 1.4em 0; }
  .doc img { max-width: 100%; height: auto; display: block; margin: 0 auto; border-radius: 12px; border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.06); }
  .doc table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: .9rem; display: block; overflow-x: auto; }
  .doc td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
  .doc a { text-decoration: underline; text-underline-offset: 3px; }
  .doc .mvideo { margin: 1.4em 0; }
  .doc .mvideo .video { border-radius: 14px; }
  .doc-frame { width: 100%; height: 78vh; border: 1px solid var(--line); border-radius: 16px; background: #fff; }

  /* ロープレ */
  .rp { display: grid; grid-template-columns: 52px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
  .rp:first-child { border-top: 0; }
  .rp .date { text-align: center; font-family: var(--en); line-height: 1.1; }
  .rp .date b { display: block; font-size: 1.3rem; font-weight: 800; }
  .rp .date span { font-size: .6rem; letter-spacing: .15em; color: var(--mute); }
  .rp .fb { margin-top: 6px; padding: 10px 12px; background: var(--paper); border-radius: 10px; font-size: .86rem; white-space: pre-wrap; }

  /* モーダル */
  .modal { position: fixed; inset: 0; z-index: 30; background: rgba(13,13,13,.6); display: flex; align-items: center; justify-content: center; padding: 12px; animation: fade .2s; }
  .modal .panel { background: #fff; border-radius: 20px; width: min(860px, 100%); max-height: 94vh; overflow: auto; animation: rise .25s cubic-bezier(.2,.8,.2,1); }
  .modal .head { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 1; }
  .modal .head strong { flex: 1; font-size: .95rem; }
  .modal .close { border: 0; background: var(--paper); width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; }
  .modal .content { padding: 16px; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(18px); opacity: 0; } }
  .video { position: relative; padding-top: 56.25%; background: #000; border-radius: 12px; overflow: hidden; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .note { border: 1px dashed var(--g4); border-radius: 12px; padding: 10px 12px; font-size: .84rem; margin: 12px 0; }
  .note b { font: 800 .62rem var(--en); letter-spacing: .2em; display: block; color: var(--mute); }

  /* お祝い・トースト */
  .celebrate { position: fixed; inset: 0; z-index: 50; background: var(--ink); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; animation: fade .3s; cursor: pointer; }
  .celebrate canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .celebrate .big { font: 800 clamp(2.2rem, 10vw, 4.4rem)/1 var(--en); letter-spacing: .08em; position: relative; animation: pop .7s ease; }
  .celebrate .sub { position: relative; margin-top: 14px; font-size: 1rem; opacity: .85; }
  .celebrate .tap { position: relative; margin-top: 30px; font: 700 .62rem var(--en); letter-spacing: .3em; opacity: .5; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 99px; font-size: .85rem; z-index: 60; max-width: 92vw; box-shadow: 0 8px 28px rgba(0,0,0,.25); animation: rise .25s; }
  .toast.err { background: #fff; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 14px; }
  .principles ol { margin: 8px 0 0; padding-left: 1.5em; }
  .principles summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; }
  .principles summary::-webkit-details-marker { display: none; }
</style>
</head>
<body>
<header class="top">
  <div class="logo">

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);

    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);

}
function h(tag, attrs) {

    var v = attrs[k];

    if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'class') el.className = v;
    else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);

}
function append(el) {
  for (var i = 1; i < arguments.length; i++) {
    var c = arguments[i];

    if (Array.isArray(c)) { c.forEach(function (x) { append(el, x); }); continue; }
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);

}

/** 黒から白への階段。今いる段に人が立ち、頂上に旗が立つ */
function stairsSvg(stage) {
  var W = 400, Hh = 190, n = STAGES.length, sw = W / n;
  var parts = ['<svg class="stairs" viewBox="0 0 ' + W + ' ' + (Hh + 20) + '" aria-hidden="true">'];
  STAGES.forEach(function (st, i) {
    var hgt = 22 + i * 20, x = i * sw, y = Hh - hgt;
    if (i <= stage) parts.push('<rect x="' + (x + 1) + '" y="' + y + '" width="' + (sw - 2) + '" height="' + hgt + '" rx="3" fill="' + st.fill + '" stroke="#fff" stroke-opacity=".55"/>');
    else parts.push('<rect x="' + (x + 1.5) + '" y="' + y + '" width="' + (sw - 3) + '" height="' + hgt + '" rx="3" fill="none" stroke="#fff" stroke-opacity=".35" stroke-dasharray="3 4"/>');
  });
  var px = stage * sw + sw / 2, py = Hh - (22 + stage * 20);
  // 頂上の旗
  var fx = (n - 1) * sw + sw / 2, fy = Hh - (22 + (n - 1) * 20);
  parts.push('<path d="M' + fx + ' ' + fy + 'v-34" stroke="#fff" stroke-width="2"/><path d="M' + fx + ' ' + (fy - 34) + 'h20l-5 6 5 6h-20z" fill="#fff"/>');
  // 人（線画）
  parts.push('<g stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none" class="climber">' +
    '<circle cx="' + px + '" cy="' + (py - 34) + '" r="5.5" fill="#0d0d0d"/>' +
    '<path d="M' + px + ' ' + (py - 28) + 'v13M' + px + ' ' + (py - 15) + 'l-5 15M' + px + ' ' + (py - 15) + 'l6 15M' + px + ' ' + (py - 24) + 'l-7 5M' + px + ' ' + (py - 24) + 'l8 -6"/></g>');
  parts.push('<text x="' + (fx - 12) + '" y="' + (fy - 42) + '" fill="#fff" font-family="Montserrat" font-weight="800" font-size="9" letter-spacing="1.5" text-anchor="middle">ROOM ADVISOR</text>');
  parts.push('</svg>');
  return svg(parts.join(''), 'stairs');
}

}

// ---------- お祝い ----------
function celebrate(big, sub) {
  var el = h('div', { class: 'celebrate', onclick: function () { el.remove(); } });
  var canvas = h('canvas');
  append(el, canvas, h('div', { class: 'big', text: big }), h('div', { class: 'sub', text: sub }), h('div', { class: 'tap', text: 'TAP TO CONTINUE' }));
  document.body.appendChild(el);
  var ctx = canvas.getContext && canvas.getContext('2d');
  if (!ctx) return;
  var W = canvas.width = innerWidth, Hh = canvas.height = innerHeight;
  var bits = [];
  for (var i = 0; i < 140; i++) bits.push({ x: Math.random() * W, y: -20 - Math.random() * Hh, s: 4 + Math.random() * 8, v: 2 + Math.random() * 4, r: Math.random() * 6, w: Math.random() > .5, c: Math.random() > .3 ? '#fff' : '#8f8f8f' });
  var t0 = Date.now();
  (function frame() {
    if (!el.isConnected) return;
    ctx.clearRect(0, 0, W, Hh);
    bits.forEach(function (b) {
      b.y += b.v; b.r += .05; b.x += Math.sin(b.r) * .8;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c;
      if (b.w) ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); else { ctx.beginPath(); ctx.arc(0, 0, b.s / 3, 0, 7); ctx.fill(); }
      ctx.restore();
    });
    if (Date.now() - t0 < 4500) requestAnimationFrame(frame);
  })();
}
function floatPoints(target, text) {
  var r = target.getBoundingClientRect();
  var f = h('div', { class: 'float-pt', text: text, style: 'left:' + (r.left + r.width / 2 - 14) + 'px;top:' + (r.top - 6) + 'px' });
  document.body.appendChild(f);
  setTimeout(function () { f.remove(); }, 1100);
}

function boot() {
  call('api_bootstrap').then(function (d) {
    S.data = d;
    if (d.me.role === '研修生') S.trainee = d.me.name;
    else S.trainee = (trainees()[0] || {}).name || null;
    var hash = location.hash.replace('#', '');
    if (TABS.some(function (t) { return t.id === hash; })) S.tab = hash;
    renderChip();
    renderTabs();
    render();
  }).catch(function (e) {
    var v = document.getElementById('view');
    v.innerHTML = '';
    append(v, h('div', { class: 'card' }, emptyArt(), h('h2', { class: 'title', text: 'ひらけませんでした' }), h('p', { text: errMsg(e) })));
  });
}
function myStats() {
  if (S.progress && S.progress.name === S.data.me.name) return { pct: progressPct(), points: S.progress.stats.points };
  var s = S.data.summaries.filter(function (x) { return x.name === S.data.me.name; })[0];
  return s ? { pct: s.percent, points: s.stats.points } : null;
}
function renderChip() {
  var chip = document.getElementById('me');
  chip.hidden = false;
  chip.innerHTML = '';
  var st = myStats();
  append(chip, h('span', { class: 'dot', style: 'background:' + (st ? STAGES[stageOf(st.pct)].fill : '#fff') }),
    h('span', { text: S.data.me.name }), st ? h('span', { class: 'pt', text: st.points + ' PT' }) : h('span', { class: 'pt', text: S.data.me.role }));
}

  });
}
function go(tab) {
  S.tab = tab;

}
function render() {
  var v = document.getElementById('view');

// ---------- 卒業フロー ----------
function loadProgress(name) {
  if (S.loadingFor === name) return;
  S.loadingFor = name;
  call('api_getProgress', name).then(function (p) {
    S.loadingFor = null;
    if (S.trainee === name) { S.progress = p; S.seenBadges = null; renderChip(); if (S.tab === 'home') render(); }
  }).catch(function (e) { S.loadingFor = null; toast(errMsg(e), true); });
}
function canEdit() { return isStaff() || S.data.me.name === S.trainee; }
function stateMap() { var m = {}; S.progress.rows.forEach(function (r) { m[r.id] = r; }); return m; }
function progressPct() {
  var all = S.progress.rows;
  return all.length ? Math.round(all.filter(function (r) { return r.done; }).length * 100 / all.length) : 0;
}
function phasesOf() {
  var phases = [];
  S.data.tasks.forEach(function (t) {
    var p = phases[phases.length - 1];
    if (!p || p.name !== t.phase) phases.push(p = { name: t.phase, tasks: [] });
    p.tasks.push(t);

}
function requiredVideos() { return S.data.materials.filter(function (m) { return m.group === 'eラーニング' && m.required; }); }

  var st = stateMap();

  var tasksDone = S.progress.rows.filter(function (r) { return r.kind === 'タスク' && r.done; }).length;
  var goalsDone = S.progress.rows.filter(function (r) { return r.kind === '卒業条件' && r.done; }).length;
  var req = requiredVideos();
  var reqDone = req.filter(function (m) { return S.progress.watched.indexOf(m.id) >= 0; }).length;
  var pct = progressPct();
  return { pct: pct, stage: stageOf(pct), phasesDone: phasesDone, tasksDone: tasksDone, goalsDone: goalsDone,
    goalsTotal: S.data.goals.length, reqDone: reqDone, reqTotal: req.length, stats: S.progress.stats };
}
var BADGES = [
  { g: '01', name: 'はじめの一歩', ok: function (s) { return s.tasksDone >= 1; } },
  { g: '10', name: 'タスク10', ok: function (s) { return s.tasksDone >= 10; } },
  { g: '30', name: 'タスク30', ok: function (s) { return s.tasksDone >= 30; } },
  { g: 'PH', name: 'フェーズ制覇', ok: function (s) { return s.phasesDone >= 1; } },
  { g: '1/2', name: '折り返し', ok: function (s) { return s.pct >= 50; } },
  { g: '▶10', name: '動画10本', ok: function (s) { return s.stats.videos >= 10; } },
  { g: '★', name: '必須動画コンプ', ok: function (s) { return s.reqTotal && s.reqDone === s.reqTotal; } },
  { g: 'RP', name: '初ロープレ', ok: function (s) { return s.stats.roleplays >= 1; } },
  { g: 'RP10', name: 'ロープレ10回', ok: function (s) { return s.stats.roleplays >= 10; } },

    append(wrap, h('div', { class: 'viewer-select' }, h('span', { class: 'eyebrow', text: 'Viewing' }), h('span', { class: 'small muted', text: '表示中の研修生' }), sel));

  // ヒーロー

    h('div', { class: 'hero-grid' },
      h('div', null,

/** チェックの付け外し。フェーズ制覇・ステージアップ時はお祝い演出 */
function toggle(id, want, anchor, cb) {
  if (cb) cb.disabled = true;
  if (anchor && anchor.tagName === 'BUTTON') anchor.disabled = true;
  var before = snapshot();
  call('api_setCheck', S.trainee, id, want).then(function (r) {
    var target = S.progress.rows.filter(function (x) { return x.id === r.id; })[0];
    var wasDone = target && target.done;
    if (target) { target.done = r.done; target.by = r.by; target.at = r.at; }
    if (target && wasDone !== r.done) {
      var pts = target.kind === '卒業条件' ? PT.goal : PT.task;
      S.progress.stats.points += r.done ? pts : -pts;
      if (r.done && S.data.me.name === S.trainee) { S.progress.stats.week++; if (!S.progress.stats.streak) S.progress.stats.streak = 1; }
    }
    var after = snapshot();
    if (r.done && anchor && anchor.isConnected) floatPoints(anchor, '+' + (target && target.kind === '卒業条件' ? PT.goal : PT.task));
    render();
    renderChip();
    if (r.done) {
      if (after.stage > before.stage) celebrate('STAGE UP', STAGES[after.stage].name + ' に到達しました');
      else if (after.goalsTotal && after.goalsDone === after.goalsTotal && before.goalsDone < before.goalsTotal) celebrate('GRADUATE', 'ルームアドバイザー卒業おめでとうございます！');
      else if (after.phasesDone > before.phasesDone) celebrate('PHASE CLEAR', 'フェーズを1つ制覇しました');
    }
  }).catch(function (e) { if (cb) { cb.checked = !want; cb.disabled = false; } toast(errMsg(e), true); render(); });
}

/** 「▶ 動画」のリンクだけの段落を、その場で再生できるプレイヤーに置き換える */

function readFile(file) {
  if (!file) return Promise.resolve(null);
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () { resolve({ name: file.name, mimeType: file.type, base64: String(r.result).split(',')[1] }); };
    r.onerror = function () { reject(new Error('ファイルを読み込めませんでした')); };
    r.readAsDataURL(file);
  });
}
