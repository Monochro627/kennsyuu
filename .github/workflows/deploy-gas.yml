# gas/ のコードが変わったら、Apps Script（研修サイト）に送ってデプロイを新バージョンにする。
# 必要なもの：リポジトリのシークレット CLASPRC_JSON（clasp@2.4.2 で login したときの ~/.clasprc.json の中身）
# URL を変えないよう、今のデプロイ（DEPLOYMENT_ID）を新しいバージョンに差し替える。
name: GASへ自動デプロイ

on:
  push:
    branches: [main, claude/festive-lamport-grgu1l]
    paths: ['gas/**', 'test/**', '.clasp.json', '.github/workflows/deploy-gas.yml']
  workflow_dispatch:

concurrency:
  group: deploy-gas
  cancel-in-progress: false

env:
  DEPLOYMENT_ID: AKfycbzMAYjG3jPmJq2Nr7NeqAUU5ZuaomuDbDA5cBVwbckjk-35joDFOQPuW__aW-7w0Oe9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: テスト（サーバー側・マニュアル表示）
        run: |
          node test/server.test.js
          node test/manual.test.js

      - name: clasp の認証情報を置く
        id: auth
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::warning::シークレット CLASPRC_JSON がまだないので、デプロイは飛ばします（README の「自動デプロイ」参照）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: コードを Apps Script に送る
        if: steps.auth.outputs.ready == 'true'
        run: npx -y @google/clasp@2.4.2 push --force

      - name: デプロイを新バージョンにする（URLはそのまま）
        if: steps.auth.outputs.ready == 'true'
        run: npx -y @google/clasp@2.4.2 deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
